# 아이폰 앱(IPA) 만들기 — 서명하지 않은 파일. 받는 사람이 Sideloadly · AltStore 로 자기 Apple 계정에 서명해 설치한다.
#   · ios-app/ 이나 이 파일을 고쳐 main 에 올리면: 빌드만 해 보고 결과물을 Actions 에 7일 보관
#   · ios-v1.2.3 같은 꼬리표(tag)를 올리면: 빌드해서 Releases 에 IPA 를 올린다
name: iOS IPA

on:
  workflow_dispatch:
  push:
    tags: ['ios-v*']
    branches: [main]
    paths: ['ios-app/**', '.github/workflows/ios.yml']

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 버전 정하기
        run: |
          # ios-v0.1.0-beta1 처럼 뒤에 -무엇 이 붙은 꼬리표는 시험판(pre-release)으로 올린다
          if [[ "$GITHUB_REF" == refs/tags/ios-v* ]]; then LABEL="${GITHUB_REF_NAME#ios-v}"; else LABEL="0.0.$GITHUB_RUN_NUMBER"; fi
          echo "APP_LABEL=$LABEL" >> "$GITHUB_ENV"
          echo "APP_VERSION=${LABEL%%-*}" >> "$GITHUB_ENV"
          echo "IPA_NAME=Dreamland-iOS-$LABEL-unsigned.ipa" >> "$GITHUB_ENV"

      - name: 웹 버전 빌드
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run build:web

      - name: iOS 프로젝트 만들기
        working-directory: ios-app
        run: |
          npm ci --no-audit --no-fund
          rm -rf www ios
          cp -R ../web www
          npx cap add ios
          npx cap sync ios

      - name: 아이콘 · 시작 화면 · 설정
        working-directory: ios-app
        run: |
          A=ios/App/App/Assets.xcassets
          cp resources/icon.png "$A/AppIcon.appiconset/AppIcon-512@2x.png"
          sips --padToHeightWidth 2732 2732 --padColor FBF5F2 resources/icon.png --out /tmp/splash.png >/dev/null
          for f in "$A"/Splash.imageset/*.png; do cp /tmp/splash.png "$f"; done
          P=ios/App/App/Info.plist
          B=/usr/libexec/PlistBuddy
          $B -c "Set :CFBundleDevelopmentRegion ko" "$P"
          $B -c "Add :ITSAppUsesNonExemptEncryption bool false" "$P"
          # 집 안의 http 주소(내 PC 의 로컬 모델 등)로도 연결할 수 있게
          $B -c "Add :NSAppTransportSecurity dict" "$P"
          $B -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$P"
          $B -c "Print" "$P"

      - name: 빌드 (서명 없이)
        working-directory: ios-app
        run: |
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -list
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 400

      - name: IPA 로 묶기
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/App.app"
          test -f "$APP/public/index.html"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qry "$IPA_NAME" Payload && rm -rf Payload && shasum -a 256 "$IPA_NAME" | tee "$IPA_NAME.sha256")
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: dreamland-ios-${{ env.APP_LABEL }}
          path: out/
          retention-days: 7

      - name: Releases 에 올리기
        if: startsWith(github.ref, 'refs/tags/ios-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""; if [[ "$APP_LABEL" == *-* ]]; then PRE="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" out/* $PRE \
            --title "Dreamland iOS $APP_LABEL" \
            --notes "아이폰 · 아이패드용 설치 파일(서명하지 않은 IPA)입니다. 설치 방법은 README 의 「아이폰 앱」을 봐 주세요."
